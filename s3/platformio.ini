; Multi-device toy remote: Autoblow cloud devices + Bluetooth toys. env:panel = Guition
; JC8048W550C (default); env:waveshare5 = Waveshare ESP32-S3-Touch-LCD-5. Both: ESP32-S3-N16R8, 5" 800x480 RGB, GT911.
[env:panel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
  lvgl/lvgl@9.5.0
  bblanchon/ArduinoJson@^7.4.0
  h2zero/NimBLE-Arduino@^2.5.1
build_flags =
  -DBOARD_HAS_PSRAM
  ; NimBLE host pools to PSRAM (src/mem.cpp)
  -Wl,--wrap=nimble_platform_mem_malloc
  -Wl,--wrap=nimble_platform_mem_calloc
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra

; RELEASE image for the web flasher: compiles in NO Wi-Fi name/password, device token, web password or host (include/secrets.h is
; not even read, include/secrets.release.h is used). Wi-Fi and token come from the Twiddle-Setup portal, the web password is made
; on the panel. Build with `pio run -e panel-release`, check with tools/check-release-image.sh, package with tools/dist.sh.
; -ffile-prefix-map keeps the builder's directories out of the image (assert/log strings carry file paths).
; lib_deps are EXACT here (the dev envs take the newest compatible), so a release can be rebuilt from its tag: the platform is pinned by URL,
; and it pins Arduino-ESP32 3.3.11, its prebuilt libraries, ESP-IDF 5.5.5 and the toolchain (see tools/lgpl-package.sh, REBUILD.md).
[env:panel-release]
extends = env:panel
lib_deps =
  lvgl/lvgl@9.5.0
  bblanchon/ArduinoJson@7.4.3
  h2zero/NimBLE-Arduino@2.5.2
build_flags =
  ${env:panel.build_flags}
  -DTWIDDLE_RELEASE=1
  -ffile-prefix-map=${platformio.packages_dir}=/pkg
  -ffile-prefix-map=${platformio.core_dir}=/pio
  -ffile-prefix-map=${platformio.workspace_dir}=/pio-build
  -ffile-prefix-map=${platformio.libdeps_dir}=/libdeps
; writes BUILD_DIR/flash-layout.json (offsets and flash settings as PlatformIO flashes them); tools/dist.sh reads it
extra_scripts = post:tools/pio_flash_layout.py

; Same firmware, uploaded over Wi-Fi: pio run -e ota -t upload
; Timing trace for the UI (serial 'uitrace:' lines every 2 s: time in lv_timer_handler, flush cost, touch read). Not for release.
[env:panel-uitrace]
extends = env:panel-release
build_flags =
  ${env:panel-release.build_flags}
  -DUI_TRACE=1

[env:ota]
extends = env:panel
upload_protocol = custom
upload_command = ./ota.sh $SOURCE

; Waveshare ESP32-S3-Touch-LCD-5 (800x480, same ESP32-S3-N16R8 module): pio run -e waveshare5 -t upload
[env:waveshare5]
extends = env:panel
build_flags =
  ${env:panel.build_flags}
  -DBOARD_WAVESHARE_LCD5
  -DPANEL_HOSTNAME=\"twiddle-ws\"

; Waveshare over Wi-Fi: pio run -e waveshare5-ota -t upload (PANEL_HOST=... to override the address)
[env:waveshare5-ota]
extends = env:waveshare5
upload_protocol = custom
upload_command = OTA_BOARD=waveshare5 ./ota.sh $SOURCE
