; Multi-device toy remote: Autoblow cloud devices + Bluetooth toys. env:panel = Guition
; JC8048W550C (default); env:waveshare5 = Waveshare ESP32-S3-Touch-LCD-5. Both: ESP32-S3-N16R8, 5" 800x480 RGB, GT911.
[env:panel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
  lvgl/lvgl@9.5.0
  bblanchon/ArduinoJson@^7.4.0
  h2zero/NimBLE-Arduino@^2.5.1
build_flags =
  -DBOARD_HAS_PSRAM
  ; NimBLE host pools to PSRAM (src/mem.cpp)
  -Wl,--wrap=nimble_platform_mem_malloc
  -Wl,--wrap=nimble_platform_mem_calloc
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=3
build_src_flags = -Wall -Wextra

; Same firmware, uploaded over Wi-Fi: pio run -e ota -t upload
[env:ota]
extends = env:panel
upload_protocol = custom
upload_command = ./ota.sh $SOURCE

; Waveshare ESP32-S3-Touch-LCD-5 (800x480, same ESP32-S3-N16R8 module): pio run -e waveshare5 -t upload
[env:waveshare5]
extends = env:panel
build_flags =
  ${env:panel.build_flags}
  -DBOARD_WAVESHARE_LCD5
  -DPANEL_HOSTNAME=\"twiddle-ws\"

; Waveshare over Wi-Fi: pio run -e waveshare5-ota -t upload (PANEL_HOST=... to override the address)
[env:waveshare5-ota]
extends = env:waveshare5
upload_protocol = custom
upload_command = OTA_BOARD=waveshare5 ./ota.sh $SOURCE
